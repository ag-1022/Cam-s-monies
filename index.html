/* Layout: one calm column, generously spaced like a page rather than a dashboard. Sticky header with month
   switcher and underline tabs; a floating Add button opens a bottom sheet. A dark grey/black surface, a clean
   system sans-serif, and clear accent colors carrying the money meaning (in / spent / saved). */
:root{
  /* Concept A, Modern Fintech: near-black surfaces, one cobalt accent; green = money in / gains,
     warm amber = spending and things to watch, red = losses and problems */
  --bg:#0E1013; --surface:#15181D; --soft:#1B1F26; --ink:#ECEEF2; --muted:#8A919E; --line:#242933;
  --accent:#5B8CFF; --accent-ink:#FFFFFF;
  --in:#3CCB8F; --out:#E2A857; --save:#3FB8C4; --draw:#9AA6B4; --bad:#F0716A;
  --display:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 10px 28px -14px rgba(0,0,0,.6),0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
.wrap{max-width:760px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 0;margin-bottom:14px}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-optical-sizing:auto;font-weight:600;font-size:27px;letter-spacing:0;margin:0;color:var(--ink)}
.monthnav{display:flex;align-items:center;gap:4px}
#msel,#ysel{width:auto;font-family:var(--display);font-weight:600;font-size:17px;padding:8px 10px;border-radius:99px;cursor:pointer;border:1px solid transparent;background:var(--soft);color:var(--ink)}
#ysel{padding-left:4px}
.iconbtn{font:inherit;font-size:19px;line-height:1;width:36px;height:36px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.iconbtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.iconbtn:disabled{opacity:.3;cursor:default}
.iconbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.tabs{display:flex;gap:20px;margin-top:12px;padding-bottom:0;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{font:inherit;font-weight:600;font-size:15px;background:none;border:0;color:var(--muted);padding:6px 1px 13px;cursor:pointer;white-space:nowrap;position:relative;transition:color .15s}
nav.tabs button::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);border-radius:2px;transform:scaleX(0);transition:transform .18s ease}
nav.tabs button[aria-selected="true"]{color:var(--ink)}
nav.tabs button[aria-selected="true"]::after{transform:scaleX(1)}
nav.tabs button:hover{color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h2{font-family:var(--display);font-optical-sizing:auto;font-size:18px;margin:0 0 10px;font-weight:600;color:var(--ink)}
.stack{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:16px;padding:14px 16px;min-width:0;box-shadow:var(--shadow-sm)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow-sm)}
/* Activity tab: date column down the left, tighter rows, nav-style filter group */
.dgrp{display:grid;grid-template-columns:132px minmax(0,1fr);gap:0 18px;align-items:start;border-top:1px solid var(--line);padding:9px 0}
.dgrp:first-child{border-top:0;padding-top:2px}
.dgrp .dlab{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:8px;white-space:nowrap}
.dgrp .tx:last-child{border-bottom:0}
.card.act .tx{padding:6px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.card.act .tx .m{font-size:12.5px}
.chips.nav{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface);flex-wrap:nowrap;max-width:100%;overflow-x:auto}
.chips.nav .chip{border:0;background:transparent;border-radius:999px;padding:5px 14px}
.chips.nav .chip:hover{color:var(--ink)}
.chips.nav .chip[aria-pressed="true"]{background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
@media (max-width:620px){.dgrp{grid-template-columns:minmax(0,1fr);gap:0}.dgrp .dlab{padding:0 0 4px}}
/* Settings: pair every label with its own control instead of stretching the page */
.set-tab .sb-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,390px),1fr));gap:10px 26px}
.set-tab .sb-cell{min-width:0}
.set-tab .set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:0 26px}
.set-tab .set-grid .set-row{border-top:1px solid var(--line)}
.set-tab .addrow input{flex:1 1 180px;max-width:360px}
/* Roomier log-scale bars for the Savings tab's "Where it's sitting" */
.hbars-md{gap:11px}
.hbars-md .hb-row{margin-bottom:5px;font-size:14.5px}
.hbars-md .bar{height:9px}
/* "Moved to savings" in How it adds up opens to show the accounts behind it */
.sum .sumdrop{display:block}
.sum .sumdrop summary{display:flex;justify-content:space-between;gap:12px;cursor:pointer;list-style:none}
.sum .sumdrop summary::-webkit-details-marker{display:none}
.sum .sumdrop summary span:first-child::after{content:" ▾";color:var(--muted);font-weight:400;font-size:12px}
.sum .sumdrop[open] summary span:first-child::after{content:" ▴"}
.sum .sumdrop summary:hover span:first-child{color:var(--accent)}
.sum .sumdrop .detail{margin-top:4px}
/* House timeline */
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 14px}
.hf{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.hf input,.hf select{width:100%}
.shares{display:grid;gap:8px;margin-top:10px}
.share{display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(130px,1fr) minmax(90px,.8fr) auto;gap:8px;align-items:center;font-size:14px}
.share input,.share select{width:100%}
@media (max-width:560px){.share{grid-template-columns:1fr 1fr}}
.tile .k{font-size:13.5px;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--display);font-optical-sizing:auto;font-size:26px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px}
.tile .s{font-size:13px;color:var(--muted)}
.tile .s b{font-size:14px;font-weight:700;opacity:.72}
.sum .detail b{font-weight:700;opacity:.72}
.c-in{color:var(--in)}.c-out{color:var(--out)}.c-save{color:var(--save)}.c-draw{color:var(--draw)}.c-accent{color:var(--accent)}
.soft-out{color:color-mix(in srgb,var(--out) 65%,white)}
.soft-draw{color:color-mix(in srgb,var(--draw) 65%,white)}
.sum{display:grid;gap:8px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sb-grid{display:grid;gap:10px;margin-top:14px}
.sb-row{display:grid;grid-template-columns:1fr minmax(110px,150px);gap:12px;align-items:center;font-weight:600}
label.inline{display:flex;align-items:center;gap:10px;margin-top:12px}
label.inline select{width:auto}
.sub-h{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 4px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.sub-h+.set-row{border-top:0}
.catset{padding:6px 0 14px;border-top:1px solid var(--line)}
.catset:first-of-type{border-top:0}

.chiplist{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:2px;padding:4px 4px 4px 12px;border-radius:99px;background:var(--soft);font-size:14px;font-weight:600}
.tag.used{padding-right:12px}
.x{font:inherit;font-size:15px;line-height:1;border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:99px}
.x.armed{color:var(--bad);font-weight:700}

.addrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.addrow input{flex:1 1 180px;width:auto}
.addrow select{width:auto;flex:0 0 auto}
.sum .detail{display:block;font-size:14px;color:var(--muted);margin-top:-4px}
.donut{display:flex;flex-wrap:wrap;align-items:center;gap:20px 32px}
.donut .chart-wrap{flex:none}

.chart-wrap{position:relative}
.chart-tip{position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-120%);background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.3;padding:6px 10px;border-radius:10px;white-space:nowrap;transition:opacity .08s;z-index:5;box-shadow:var(--shadow-md)}

.donut .lg b{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.sum .end{border-top:2px solid var(--line);padding-top:10px;font-weight:700;font-size:18px}
.note{font-size:14px;color:var(--muted);margin:10px 0 0}
.cat{border-top:1px solid var(--line)}
.cat:first-of-type{border-top:0}
.cat summary{list-style:none;cursor:pointer;padding:10px 0;display:grid;gap:6px}
.cat summary::-webkit-details-marker{display:none}
.cat .r{display:flex;justify-content:space-between;gap:12px;font-weight:600;font-variant-numeric:tabular-nums}
.cat .r span:first-child::after{content:" ▾";color:var(--muted);font-weight:400;font-size:12px}
.cat[open] .r span:first-child::after{content:" ▴"}
.bar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--out);border-radius:5px;opacity:.85}
.bar.save i{background:var(--save)}
.bar.inv i{background:var(--accent)}
.hbars{display:grid;gap:12px}
.hb-row{display:flex;justify-content:space-between;gap:12px;font-weight:600;font-variant-numeric:tabular-nums;margin-bottom:4px}
.hbars-sm{gap:5px}
.hbars-sm .hb-row{margin-bottom:2px;font-size:13.5px}
.hbars-sm .bar{height:6px}
.subs{padding:0 0 10px;display:grid;gap:4px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.subs div{display:flex;justify-content:space-between}
.hb-acct{list-style:none}
.hb-acct summary{list-style:none;cursor:pointer;padding:0;margin:0}
.hb-acct summary::-webkit-details-marker{display:none}
.hb-acct summary .hb-row span:first-child::after{content:" ▾";color:var(--muted);font-weight:400;font-size:12px}
.hb-acct[open] summary .hb-row span:first-child::after{content:" ▴"}
.hb-acct .subs{padding-top:2px}
.hb-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{font:inherit;font-weight:600;font-size:14px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;transition:border-color .15s,color .15s}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.chips.sub .chip[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 16%,var(--soft));border-color:transparent;color:var(--accent)}
.day{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 4px}

.tx{border-bottom:1px solid var(--line);padding:8px 0;cursor:pointer}

.tx .t{font-weight:600;min-width:0;overflow-wrap:anywhere}

.tx .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx .act{display:flex;gap:8px;margin-top:8px}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:99px;cursor:pointer;transition:border-color .15s,background .15s}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

  background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:14px 24px;cursor:pointer;box-shadow:0 10px 24px -8px color-mix(in srgb,var(--accent) 55%,transparent);transition:transform .15s}

/* ===== Concept A layer: top pill tabs, soft cards, one cobalt accent (system fonts) ===== */
.wrap.shell{max-width:1040px;display:block}
.mainc{min-width:0}
header.top{padding:16px 0 14px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.titlebar{flex-wrap:wrap;row-gap:10px;gap:16px}
#crumb{font-size:19px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}#crumb b{color:var(--ink);font-weight:700}
#crumb .ctx{color:var(--muted);font-weight:500;font-size:14px;margin-left:8px}
nav.tabs{display:flex;gap:2px;margin:0;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface);overflow-x:auto;flex:0 1 auto;margin-left:auto}
nav.tabs button{padding:6px 14px;border-radius:999px;font-size:13.5px;font-weight:500;white-space:nowrap}
nav.tabs button::after{display:none}
nav.tabs button[aria-selected="true"]{background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
nav.tabs button:hover{color:var(--ink)}
.monthnav{gap:6px;flex-wrap:wrap}
#msel,#ysel{font-size:14px;font-weight:600;border-radius:8px;padding:7px 10px;border:1px solid var(--line);background:var(--surface)}
.iconbtn{border-radius:8px;width:30px;height:30px;font-size:16px}
.btn.hdr{padding:7px 14px;font-size:13px;border-radius:8px}
.card,.tile{border-radius:10px;box-shadow:none;border:1px solid var(--line)}
.notice,.chip{border-radius:8px}
.btn{border-radius:8px}
.fab{border-radius:999px;box-shadow:0 10px 24px -10px rgba(91,140,255,.55)}
.fab2{border-radius:999px;background:var(--surface);color:var(--ink);border-color:var(--line)}
#toast{border-radius:8px;font-size:14px;bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.fab,.fab2{display:none}
@media (max-width:760px){nav.tabs{order:3;flex-basis:100%;margin-left:0}.btn.hdr{display:none}.fab,.fab2{display:inline-block}}
/* A panels (Home) */
.pn{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px 0}
.ph h3{margin:0;font-size:14px;font-weight:600}
.lab{font-size:12.5px;font-weight:500;color:var(--muted)}
.pb{padding:12px 18px 16px}
/* hero: big number + three tiles */
.ghero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.hero-big{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px 16px}
.hero-big .v{font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.hero-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:8px;margin-top:10px;font-variant-numeric:tabular-nums}
.hero-chip.up{background:color-mix(in srgb,var(--in) 14%,transparent);color:var(--in)}
.hero-chip.dn{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.hero-split{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:12.5px}
.hero-split b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.k3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.k3>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px;display:grid;gap:2px;min-width:0}
.k3 .v{font-size:20px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.k3 .d{font-size:12px}
.c-mu{color:var(--muted)}.c-bad{color:var(--bad)}
.g2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.g2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.ctab{width:100%;border-collapse:collapse;font-size:13.5px}
.ctab th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:0 18px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ctab td{padding:10px 18px;border-top:1px solid var(--line)}
.ctab tbody tr:first-child td{border-top:0}
.ctab td,.ctab th{text-align:left}
.ctab td:first-child{width:46%}
.ctab th.r,.ctab td.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ubar{height:5px;background:var(--soft);border-radius:3px;position:relative;margin-top:7px;max-width:220px}
.ubar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--accent)}
.ubar u{position:absolute;top:-3px;width:2px;height:11px;background:var(--ink);opacity:.7;border-radius:1px}
.cbrief{display:grid;gap:9px;font-size:14px;color:var(--muted);line-height:1.5}
.cbrief div{display:grid;grid-template-columns:7px 1fr;gap:11px}
.cbrief div::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:7px}
.cbrief div.w::before{background:var(--out)}
.cbrief b{color:var(--ink);font-weight:600}
/* info marker: long explanations live behind this instead of as grey paragraphs */
.h-row{display:flex;align-items:center;gap:8px;margin:0 0 14px}
.h-row h2{margin:0}
.info{width:18px;height:18px;flex:none;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);font:600 11px/1 var(--body);cursor:pointer;padding:0}
.info:hover,.info[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.info-note{font-size:13.5px;color:var(--muted);line-height:1.5;background:var(--soft);border-radius:8px;padding:10px 12px;margin:0 0 12px}
/* activity rows: one dot for the kind, neutral amounts except money in / money out */
.tx .row{align-items:center}
.tx .t{display:flex;align-items:center;gap:9px}
.tx .kd{width:7px;height:7px;border-radius:50%;flex:none}
.tx .m{margin-left:16px}
.a-neutral{color:var(--ink)}
/* year table: compact rows, a marker on the best savings month and on months that ran negative */
.ctab tr.best td{background:color-mix(in srgb,var(--in) 8%,transparent)}
.ctab tr.neg td{background:color-mix(in srgb,var(--bad) 7%,transparent)}
.ctab tr.tot td{font-weight:700;border-top:2px solid var(--line);background:var(--soft)}
.ctab .tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px;margin-left:8px;vertical-align:1px}
.ctab .tag.b{background:color-mix(in srgb,var(--in) 16%,transparent);color:var(--in)}
.ctab .tag.n{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
/* account rows: tighter, with the balance and its change stacked on the right */
.acc{padding:9px 0;align-items:center}
.acc .n{font-weight:600;font-size:14.5px}
.acc .d{font-size:12.5px;line-height:1.45}
.acc .b{font-size:15px;font-weight:600}
.acc .chg{font-size:12.5px;font-weight:500;color:var(--muted);text-align:right}
.acc .chg.up{color:var(--in)}.acc .chg.dn{color:var(--bad)}
.stale-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--out);margin-right:6px;vertical-align:1px}
@media (max-width:860px){.ghero,.g2,.g2e{grid-template-columns:1fr}.k3{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.k3{grid-template-columns:1fr}}

  window.__monies={import(o){data={v:3,ledger:o.ledger||{},config:o.config||{}};persist();note()}};
