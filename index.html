/* ---- standalone storage: everything is kept in this browser (localStorage) ---- */
const SEED={"v":3,"ledger":{},"config":{}};

  const sub=fn=>{subs.push(fn);setTimeout(fn,0);return()=>{const i=subs.indexOf(fn);if(i>=0)subs.splice(i,1)}};
  window.__monies={import(o){data={v:3,ledger:o.ledger||{},config:o.config||{}};persist();note()}};

    doc(p){const[c,id]=p.split("/");
